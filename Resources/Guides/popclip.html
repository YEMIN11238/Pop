<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop · PopClip</title><style>body{font:16px/1.8 -apple-system,BlinkMacSystemFont,sans-serif;color:#282828;background:#fff;max-width:760px;padding:40px 28px;margin:auto}nav{color:#777;border-bottom:1px solid #eee;padding-bottom:16px}h1{font-size:30px}h2{font-size:20px;margin-top:32px}pre{white-space:pre-wrap;background:#f5f5f5;padding:18px;border-radius:12px;overflow:auto}code{font:14px/1.7 ui-monospace,monospace}a{color:#0677ff}</style><nav>Pop / 集成 / PopClip</nav><h1>PopClip</h1><p>在 PopClip 中选中文字后点击 Pop 图标，即可把选中文字发送到 Pop 进行翻译。</p><h2>安装扩展</h2><ol><li>先安装并打开 PopClip。</li><li><a href="../Integrations/PopClip/pop.popclipextz" download>保存 Pop 的 PopClip 扩展</a>，双击扩展文件，在 PopClip 中确认安装。</li><li>选中文字，在 PopClip 弹出的工具栏点击 Pop。</li></ol><p>扩展调用本机 Pop URL 接口，不需要翻译 API 密钥；具体翻译服务在 Pop 设置中选择。</p><p><a href="https://bobtranslate.com/guide/integration/popclip.html">查看 Bob 对应集成的官方说明</a></p></html>
